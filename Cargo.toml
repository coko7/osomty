[package]
name = "osomty"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Browse the OpenStreetMap world map in your terminal"
license = "MIT"
repository = "https://github.com/coko7/osomty"
readme = "README.md"
keywords = ["map", "openstreetmap", "tui", "ratatui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29"
dirs = "7.0.0"
flate2 = "1.1.10"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }
